[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
# Block syntax/import/name errors and unsafe broad exception assertions.
# Typing syntax modernization and import cosmetics are handled separately so
# this PR does not rewrite unrelated legacy code while preserving hard gates.
select = ["E4", "E7", "E9", "F", "B017"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The repository facade installs the strict JSON compatibility contract before
# importing modules that capture the legacy serializer.
"backtest_promotion_repository.py" = ["E402"]
# PR 31 kept shared imports in the base module for compatibility with existing
# promotion consumers. Removal is deferred until the facade is retired.
"backtest_promotion_base.py" = ["F401"]
# The lifecycle assertion predates the exact-lookup-specific regression test;
# that exact test remains blocking in this workflow.
"tests/test_backtest_promotion_lifecycle.py" = ["B017"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true
source = [
  "backtest_json_contract",
  "backtest_promotion_concurrency",
  "backtest_promotion_exact_lookup",
  "backtest_promotion_models",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
