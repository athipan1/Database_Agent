[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
# The promotion gate blocks syntax/import/name errors and unsafe broad
# exception assertions. Typing syntax modernization and import cosmetics are
# intentionally handled separately so this PR does not rewrite unrelated
# legacy code while still catching defects that change runtime behavior.
select = ["E4", "E7", "E9", "F", "B017"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backtest_promotion_repository.py" = ["E402"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true
source = [
  "backtest_json_contract",
  "backtest_promotion_concurrency",
  "backtest_promotion_exact_lookup",
  "backtest_promotion_models",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
