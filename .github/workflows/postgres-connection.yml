name: Railway Postgres Connection Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/postgres-connection.yml"
      - "trading_db.py"
      - "history_repository.py"
      - "main.py"

jobs:
  check-postgres:
    name: Check Railway PostgreSQL
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL driver
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Verify DATABASE_URL secret exists
        run: |
          python - <<'PY'
          import os
          if not os.getenv("DATABASE_URL"):
              raise SystemExit("DATABASE_URL secret is missing or empty")
          print("DATABASE_URL secret is present")
          PY

      - name: Connect to Railway Postgres with SSL and retries
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.parse import urlparse
          import psycopg2
          from psycopg2 import OperationalError

          database_url = os.environ["DATABASE_URL"].strip()
          parsed = urlparse(database_url)

          if not parsed.hostname or not parsed.port or not parsed.path:
              raise SystemExit("DATABASE_URL format is invalid")

          print(f"Connecting to host={parsed.hostname} port={parsed.port} database={parsed.path.lstrip('/')}")

          last_error = None
          for attempt in range(1, 6):
              try:
                  print(f"Connection attempt {attempt}/5")
                  conn = psycopg2.connect(
                      database_url,
                      connect_timeout=15,
                      sslmode="require",
                      keepalives=1,
                      keepalives_idle=30,
                      keepalives_interval=10,
                      keepalives_count=3,
                  )
                  try:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                          result = cur.fetchone()[0]
                          if result != 1:
                              raise SystemExit("Unexpected SELECT 1 result")
                      print("Railway PostgreSQL connection OK")
                      break
                  finally:
                      conn.close()
              except OperationalError as exc:
                  last_error = exc
                  print(f"Connection attempt {attempt} failed: {exc}")
                  if attempt < 5:
                      time.sleep(attempt * 3)
          else:
              raise SystemExit(f"Railway PostgreSQL connection failed after retries: {last_error}")
          PY
