name: Railway Postgres Connection Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/postgres-connection.yml"
      - "trading_db.py"
      - "history_repository.py"
      - "main.py"

jobs:
  check-postgres:
    name: Check Railway PostgreSQL
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client netcat-openbsd
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Verify DATABASE_URL secret exists
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.getenv("DATABASE_URL", "").strip()
          if not url:
              raise SystemExit("DATABASE_URL secret is missing or empty")
          parsed = urlparse(url)
          if not parsed.hostname or not parsed.port or not parsed.path:
              raise SystemExit("DATABASE_URL format is invalid")
          print(f"DATABASE_URL present: host={parsed.hostname} port={parsed.port} database={parsed.path.lstrip('/')}")
          PY

      - name: Probe TCP port
        run: |
          python - <<'PY' > /tmp/pg_host_port.env
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ["DATABASE_URL"].strip())
          print(f"PGHOST={parsed.hostname}")
          print(f"PGPORT={parsed.port}")
          PY
          source /tmp/pg_host_port.env
          echo "TCP probe to $PGHOST:$PGPORT"
          nc -vz -w 10 "$PGHOST" "$PGPORT"

      - name: Check with pg_isready
        continue-on-error: true
        run: |
          pg_isready -d "$DATABASE_URL" -t 15

      - name: Check with psql
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 AS railway_postgres_ok;"

      - name: Check with psycopg2
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.parse import urlparse
          import psycopg2
          from psycopg2 import OperationalError

          database_url = os.environ["DATABASE_URL"].strip()
          parsed = urlparse(database_url)
          print(f"Connecting to host={parsed.hostname} port={parsed.port} database={parsed.path.lstrip('/')}")

          last_error = None
          for attempt in range(1, 4):
              try:
                  print(f"Connection attempt {attempt}/3")
                  conn = psycopg2.connect(database_url, connect_timeout=15, sslmode="require")
                  try:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                          result = cur.fetchone()[0]
                          if result != 1:
                              raise SystemExit("Unexpected SELECT 1 result")
                      print("Railway PostgreSQL connection OK")
                      break
                  finally:
                      conn.close()
              except OperationalError as exc:
                  last_error = exc
                  print(f"Connection attempt {attempt} failed: {exc}")
                  if attempt < 3:
                      time.sleep(attempt * 3)
          else:
              raise SystemExit(f"Railway PostgreSQL connection failed after retries: {last_error}")
          PY
