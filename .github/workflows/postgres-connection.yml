name: Railway Postgres Connection Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/postgres-connection.yml"
      - "trading_db.py"
      - "history_repository.py"
      - "main.py"

jobs:
  check-postgres:
    name: Check Railway PostgreSQL
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL driver
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Verify DATABASE_URL secret exists
        run: |
          python - <<'PY'
          import os
          if not os.getenv("DATABASE_URL"):
              raise SystemExit("DATABASE_URL secret is missing or empty")
          print("DATABASE_URL secret is present")
          PY

      - name: Connect to Railway Postgres
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          import psycopg2

          database_url = os.environ["DATABASE_URL"]
          parsed = urlparse(database_url)

          print(f"Connecting to host={parsed.hostname} port={parsed.port} database={parsed.path.lstrip('/')}")

          conn = psycopg2.connect(database_url, connect_timeout=10)
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1")
                  result = cur.fetchone()[0]
                  if result != 1:
                      raise SystemExit("Unexpected SELECT 1 result")
              print("Railway PostgreSQL connection OK")
          finally:
              conn.close()
          PY
