name: Supabase Primary Connection Diagnostic

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: your_strong_password_here
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest and capture output
        id: pytest
        continue-on-error: true
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: your_strong_password_here
          POSTGRES_DB: trading_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_AGENT_API_KEY: test_database_key
          DATABASE_DEV_MODE: "true"
        run: |
          set +e
          python -m pytest > pytest-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 260 pytest-output.txt > pytest-tail.txt
          exit 0
      - name: Post sanitized pytest tail
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
        run: |
          {
            echo "Supabase primary connection pytest exit code: \`$EXIT_CODE\`"
            echo
            echo '```text'
            cat pytest-tail.txt
            echo '```'
            echo
            echo "Run ID: \`${{ github.run_id }}\`"
            echo "Commit: \`${{ github.event.pull_request.head.sha }}\`"
          } > comment.md
          gh api repos/${{ github.repository }}/issues/101/comments --method POST --input comment.md -H 'Content-Type: text/plain' || \
          gh issue comment 101 --body-file comment.md
      - name: Fail when pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
