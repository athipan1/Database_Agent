name: PR83 Runtime Contract Debug

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  POSTGRES_USER: trading_user
  POSTGRES_PASSWORD: your_strong_password_here
  POSTGRES_DB: trading_db_test
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  DATABASE_AGENT_API_KEY: test_database_key
  DATABASE_DEV_MODE: "true"

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: your_strong_password_here
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Skill performance route present
        run: python -c 'import main_with_skill_routes as r; c=sum(1 for x in r.app.routes if getattr(x,"path",None)=="/skills/performance/rank" and "GET" in (getattr(x,"methods",None) or set())); assert c >= 1, c'
      - name: Skill performance route unique
        if: always()
        run: python -c 'import main_with_skill_routes as r; c=sum(1 for x in r.app.routes if getattr(x,"path",None)=="/skills/performance/rank" and "GET" in (getattr(x,"methods",None) or set())); assert c <= 1, c'
      - name: Latest backtest route present
        if: always()
        run: python -c 'import main_with_skill_routes as r; c=sum(1 for x in r.app.routes if getattr(x,"path",None)=="/backtests/runs/latest" and "GET" in (getattr(x,"methods",None) or set())); assert c >= 1, c'
      - name: Latest backtest route unique
        if: always()
        run: python -c 'import main_with_skill_routes as r; c=sum(1 for x in r.app.routes if getattr(x,"path",None)=="/backtests/runs/latest" and "GET" in (getattr(x,"methods",None) or set())); assert c <= 1, c'
      - name: Skill backtest route present
        if: always()
        run: python -c 'import main_with_skill_routes as r; c=sum(1 for x in r.app.routes if getattr(x,"path",None)=="/skills/{skill_id}/backtest-status" and "GET" in (getattr(x,"methods",None) or set())); assert c >= 1, c'
      - name: Skill backtest route unique
        if: always()
        run: python -c 'import main_with_skill_routes as r; c=sum(1 for x in r.app.routes if getattr(x,"path",None)=="/skills/{skill_id}/backtest-status" and "GET" in (getattr(x,"methods",None) or set())); assert c <= 1, c'
      - name: Execute response contract
        if: always()
        run: python -m pytest -q tests/test_runtime_order_execution_contract.py::test_execute_order_endpoint_returns_declared_response_object
      - name: Account mismatch guard
        if: always()
        run: python -m pytest -q tests/test_runtime_order_execution_contract.py::test_execute_order_endpoint_rejects_account_mismatch_without_execution
      - name: Legacy compatibility
        if: always()
        run: python -m pytest -q tests/test_runtime_order_execution_contract.py::test_legacy_single_argument_execute_order_contract_is_preserved

  baseline-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: your_strong_password_here
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Test existing regression suite
        run: python -m pytest -q --ignore=tests/test_runtime_order_execution_contract.py
