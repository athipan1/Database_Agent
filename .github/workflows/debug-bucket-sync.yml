name: Debug Bucket Sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: your_strong_password_here
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run first-failure diagnostics
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: your_strong_password_here
          POSTGRES_DB: trading_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_AGENT_API_KEY: test_database_key
          DATABASE_DEV_MODE: "true"
        run: |
          set +e
          python -m pytest -x -q --tb=short > pytest-output.txt 2>&1
          status=$?
          echo "$status" > pytest-status.txt
          cat pytest-output.txt
          exit "$status"
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-sync-pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-status.txt
          if-no-files-found: error
