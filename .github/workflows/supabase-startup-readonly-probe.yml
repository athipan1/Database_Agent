name: Supabase Startup Read-only Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  boot-probe:
    runs-on: ubuntu-latest
    environment: supabase-primary-cutover
    timeout-minutes: 10
    env:
      DATABASE_PROVIDER: supabase
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_SSL_MODE: require
      DATABASE_CREATE_IF_MISSING: 'false'
      DATABASE_AGENT_API_KEY: pr126-readonly-boot-key
      DATABASE_DEV_MODE: 'false'
      DATABASE_REQUIRE_SCHEMA_IDENTITY: 'true'
      TRADING_MODE: PAPER
      REDIS_HOST: localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Measure read-only API boot against Supabase
        run: |
          test -n "$DATABASE_URL"
          started="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"
          python -m uvicorn main:app --host 127.0.0.1 --port 8004 >/tmp/database-agent-supabase-startup.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8004/ready >/tmp/ready.json; then
              ended="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"
              python - "$started" "$ended" <<'PY'
          import json
          import sys
          from pathlib import Path
          elapsed = float(sys.argv[2]) - float(sys.argv[1])
          ready = json.loads(Path('/tmp/ready.json').read_text())
          data = ready.get('data') or {}
          evidence = {
              'boot_seconds': round(elapsed, 3),
              'ready': data.get('ready'),
              'provider': data.get('provider'),
              'schema_identity_match': data.get('schema_identity_match'),
              'schema_version': data.get('schema_version'),
              'tls': data.get('tls'),
          }
          print(json.dumps(evidence, sort_keys=True))
          if data.get('ready') is not True:
              raise SystemExit('Supabase readiness did not pass')
          if data.get('schema_identity_match') is not True:
              raise SystemExit('schema identity mismatch')
          if elapsed >= 15:
              raise SystemExit(f'Supabase boot too slow: {elapsed:.3f}s >= 15s')
          PY
              if grep -E 'Ensured column|CREATE TABLE|ALTER TABLE|verification/creation complete' /tmp/database-agent-supabase-startup.log; then
                echo 'DDL-like startup log detected' >&2
                cat /tmp/database-agent-supabase-startup.log
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          cat /tmp/database-agent-supabase-startup.log
          exit 1
