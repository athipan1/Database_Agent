name: Supabase Primary Schema Diagnostic

on:
  pull_request:
    branches:
      - agent/supabase-primary-connection

permissions:
  contents: read

jobs:
  generate-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: schema_test_password
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build canonical schema through application setup
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: postgresql://trading_user:schema_test_password@localhost:5432/trading_db_test
          DATABASE_SSL_MODE: disable
          DATABASE_CREATE_IF_MISSING: 'true'
          DATABASE_AGENT_API_KEY: schema-test-key
          DATABASE_DEV_MODE: 'true'
          TRADING_MODE: PAPER
          REDIS_HOST: localhost
        run: |
          python - <<'PY'
          from app.startup import setup_runtime_tables
          from trading_db import TradingDB

          database = TradingDB(max_retries=3, initial_delay=0.1)
          setup_runtime_tables(database)
          assert database.check_connection()
          PY

      - name: Install PostgreSQL client
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Export canonical schema and manifest
        env:
          PGPASSWORD: schema_test_password
        run: |
          mkdir -p schema-artifact
          pg_dump \
            --host localhost \
            --port 5432 \
            --username trading_user \
            --dbname trading_db_test \
            --schema-only \
            --no-owner \
            --no-privileges \
            --format plain \
            --file schema-artifact/database_agent_schema.sql
          psql \
            --host localhost \
            --port 5432 \
            --username trading_user \
            --dbname trading_db_test \
            --tuples-only \
            --no-align \
            --command "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by table_name" \
            > schema-artifact/table_manifest.txt
          sha256sum schema-artifact/database_agent_schema.sql > schema-artifact/schema.sha256

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-agent-canonical-schema
          path: schema-artifact/
          if-no-files-found: error
          retention-days: 3
