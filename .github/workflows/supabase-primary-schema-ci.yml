name: Supabase Primary Schema CI

on:
  pull_request:
    branches:
      - agent/supabase-primary-connection

permissions:
  contents: read

jobs:
  schema-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: schema_test_password
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run full test suite
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: schema_test_password
          POSTGRES_DB: trading_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_AGENT_API_KEY: schema-test-key
          DATABASE_DEV_MODE: 'true'
        run: python -m pytest

      - name: Build canonical schema through deployment migrations
        env:
          DATABASE_PROVIDER: postgres
          DATABASE_URL: postgresql://trading_user:schema_test_password@localhost:5432/trading_db_test
          DATABASE_SSL_MODE: disable
          DATABASE_CREATE_IF_MISSING: 'false'
          DATABASE_AGENT_API_KEY: schema-test-key
          DATABASE_DEV_MODE: 'false'
          DATABASE_REQUIRE_SCHEMA_IDENTITY: 'true'
          TRADING_MODE: PAPER
          REDIS_HOST: localhost
        run: |
          python -m scripts.apply_runtime_migrations
          python - <<'PY'
          from app.core.config import Settings
          from app.services.database_provider import create_trading_db
          from schema_identity_repository import schema_identity_matches

          database = create_trading_db(Settings.from_environ())
          assert database.check_connection()
          assert schema_identity_matches(database)
          PY

      - name: Verify manifest against generated schema
        env:
          DATABASE_URL: postgresql://trading_user:schema_test_password@localhost:5432/trading_db_test
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg2

          manifest = json.loads(Path('supabase/schema_manifest.json').read_text())
          connection = psycopg2.connect(os.environ['DATABASE_URL'])
          try:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      select c.relname
                      from pg_class c
                      join pg_namespace n on n.oid = c.relnamespace
                      where n.nspname = 'public' and c.relkind in ('r', 'p')
                  """)
                  actual = {row[0] for row in cursor.fetchall()}
                  assert set(manifest['tables']).issubset(actual)
                  cursor.execute("""
                      select count(*) from pg_inherits i
                      join pg_class p on p.oid = i.inhparent
                      join pg_namespace n on n.oid = p.relnamespace
                      where n.nspname = 'public' and p.relname = 'prices'
                  """)
                  assert cursor.fetchone()[0] == manifest['expected_price_partition_count']
          finally:
              connection.close()
          PY

      - name: Export schema artifact
        env:
          PGPASSWORD: schema_test_password
        run: |
          mkdir -p schema-artifact
          pg_dump \
            --host localhost \
            --port 5432 \
            --username trading_user \
            --dbname trading_db_test \
            --schema-only \
            --no-owner \
            --no-privileges \
            --format plain \
            --file schema-artifact/database_agent_schema.sql
          cp supabase/schema_manifest.json schema-artifact/
          sha256sum schema-artifact/database_agent_schema.sql > schema-artifact/schema.sha256

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-agent-canonical-schema
          path: schema-artifact/
          if-no-files-found: error
          retention-days: 7
