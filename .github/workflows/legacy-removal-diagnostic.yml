name: Legacy Removal Diagnostic

on:
  push:
    branches:
      - agent/remove-legacy-main

permissions:
  contents: read
  issues: write

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: trading_user
          POSTGRES_PASSWORD: your_strong_password_here
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: your_strong_password_here
      POSTGRES_DB: trading_db_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_AGENT_API_KEY: test_database_key
      DATABASE_DEV_MODE: "true"
      TRADING_MODE: PAPER
      ALPACA_API_KEY: test-alpaca-key
      ALPACA_SECRET_KEY: test-alpaca-secret
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest and report sanitized tail
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          status=$?
          set -e
          tail -n 220 pytest-output.txt > pytest-tail.txt
          body=$(printf 'Legacy removal pytest exit code: `%s`\n\n```text\n%s\n```\n\nRun ID: `%s`\nCommit: `%s`' "$status" "$(cat pytest-tail.txt)" "$GITHUB_RUN_ID" "$GITHUB_SHA")
          gh api "repos/${GITHUB_REPOSITORY}/issues/93/comments" -f body="$body"
          exit "$status"
