name: Database Primary API Smoke

on:
  workflow_dispatch:
    inputs:
      database_agent_url:
        description: Optional public Database_Agent URL override
        required: false
        type: string
      expected_provider:
        description: Expected active database provider
        required: true
        default: supabase
        type: choice
        options:
          - supabase
          - postgres

permissions:
  contents: read

jobs:
  write-read-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-primary-cutover
    env:
      DATABASE_AGENT_URL: ${{ inputs.database_agent_url || vars.DATABASE_AGENT_URL || secrets.DATABASE_AGENT_URL }}
      DATABASE_AGENT_API_KEY: ${{ secrets.DATABASE_AGENT_API_KEY }}
      DATABASE_EXPECTED_PROVIDER: ${{ inputs.expected_provider }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required configuration
        shell: bash
        run: |
          test -n "$DATABASE_AGENT_URL" || {
            echo "DATABASE_AGENT_URL is missing" >&2
            exit 1
          }
          test -n "$DATABASE_AGENT_API_KEY" || {
            echo "DATABASE_AGENT_API_KEY secret is missing" >&2
            exit 1
          }

      - name: Verify deployed readiness and write/read persistence
        shell: bash
        run: |
          python scripts/database_primary_api_smoke.py \
            | tee database-primary-api-smoke-result.json

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          echo "## Database Primary API Smoke" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f database-primary-api-smoke-result.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat database-primary-api-smoke-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The smoke script did not produce a result file." >> "$GITHUB_STEP_SUMMARY"
          fi
